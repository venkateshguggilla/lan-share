name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node test/netprofile.test.js
      - name: End-to-end test (Windows)
        if: runner.os == 'Windows'
        run: npx electron test/e2e.js
      - name: End-to-end test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox test/e2e.js
